name: terraform-apply

# Runs after a PR is merged to main.
#   1. plan   - creates a saved plan (OIDC subject: ref:refs/heads/main)
#   2. apply  - waits for a required reviewer on the "production" GitHub
#               Environment (manual approval gate), then applies THAT plan
#               (OIDC subject: environment:production)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false # never cancel an in-flight apply

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  plan:
    name: plan (main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write terraform.tfvars from secret
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: |
          if [ -z "$TFVARS" ]; then echo "::error::Repository secret TFVARS is empty - see docs/SETUP.md"; exit 1; fi
          printf '%s\n' "$TFVARS" > terraform.tfvars

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=azure-secure-landing-zone/dev.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ $code -eq 1 ]; then exit 1; fi
          if [ $code -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    name: apply (requires approval)
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: production # required reviewers configured in repo settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=azure-secure-landing-zone/dev.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: terraform apply (saved plan)
        run: terraform apply -lock-timeout=5m -no-color tfplan
